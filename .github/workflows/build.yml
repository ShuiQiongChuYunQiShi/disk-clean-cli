name: build

on:
  push:
    branches: ['master']
    tags: ['v*']
  pull_request:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        shell: pwsh
        run: |
          Get-ChildItem bin,lib,scripts -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName }
          Get-ChildItem test -Filter *.js | ForEach-Object { node --check $_.FullName }
          node --check gui\web\ui-kit.js
          node --check gui\web\app.js

      - name: Test suite
        # engine-smoke / engine-edge / clean-safety / organize-safety /
        # serve-integration / mcp-protocol / version-consistency
        run: node test/all.js

      - name: Install build deps (from lockfile)
        run: npm ci

      - name: Build exe (Node SEA)
        run: powershell -ExecutionPolicy Bypass -File scripts\build-sea.ps1

      - name: Checksums
        run: |
          $h = (Get-FileHash -Algorithm SHA256 dist\disk-clean-win-x64.exe).Hash.ToLower()
          "sha256=$h" | Out-File -Encoding ascii dist\checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disk-clean-win-x64
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        permissions:
          contents: write
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/disk-clean-win-x64.exe
            dist/checksums.txt
          generate_release_notes: true
