<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>disk-clean</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#12141a; color:#e8eaf0; font-family:"Segoe UI",system-ui,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; }
  .card { text-align:center; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#3ddc84; margin-right:8px; animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
</style>
</head>
<body>
  <div class="card">
    <h1><span class="dot"></span>disk-clean 引擎已就绪</h1>
    <p id="ver">加载中…</p>
  </div>
<script>
fetch('/api/health').then(r => r.json()).then(j => {
  document.getElementById('ver').textContent = '引擎版本 ' + (j.version || '?');
});
</script>
</body>
</html>
